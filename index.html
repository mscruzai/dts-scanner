<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DTS Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      text-align: center;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #result {
      font-size: 18px;
      margin-top: 20px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h2>DTS QR Scanner</h2>

  <div id="reader"></div>

  <div id="result">Point the camera at a QR code.</div>

  <script>

    const DTS_URL =
      "https://script.google.com/macros/s/AKfycbylUvoPorCJVmoEI_pEnSM4N-0eBo98JuKzsKyGm2R-ehaAaKTzwe13dKUjngi0QXWG4w/exec";

    let alreadyScanned = false;

    function onScanSuccess(decodedText) {

      if (alreadyScanned) return;

      alreadyScanned = true;

      document.getElementById("result").innerText =
        "QR detected: " + decodedText;

      scanner.clear().then(function() {

        const destination =
          DTS_URL + "?qr=" + encodeURIComponent(decodedText);

        window.location.href = destination;

      }).catch(function(error) {

        const destination =
          DTS_URL + "?qr=" + encodeURIComponent(decodedText);

        window.location.href = destination;

      });
    }

    function onScanFailure(error) {
      // Ignore normal scanning failures
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );

    scanner.render(onScanSuccess, onScanFailure);

  </script>

</body>
</html>
